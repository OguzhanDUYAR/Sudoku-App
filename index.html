<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Decrypter | Sudoku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Particle Network Background -->
    <canvas id="particle-canvas"></canvas>
    
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="title">
                    <span class="glitch" data-text="NEURAL DECRYPTER">NEURAL DECRYPTER</span>
                </h1>
                <p class="subtitle">// SYSTEM ACCESS GRANTED</p>
            </div>
        </header>

        <!-- Main Game Container -->
        <div class="game-container">
            <!-- Stats Panel -->
            <div class="stats-panel">
                <div class="stat-item">
                    <span class="stat-label">DIFFICULTY</span>
                    <span class="stat-value" id="difficulty-display">EASY</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">TIMER</span>
                    <span class="stat-value" id="timer-display">00:00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">SYSTEM INTEGRITY</span>
                    <div class="integrity-container">
                        <div class="integrity-bar">
                            <div class="integrity-fill" id="integrity-fill"></div>
                        </div>
                        <span class="integrity-value" id="integrity-value">100%</span>
                    </div>
                </div>
            </div>

            <!-- Game Board -->
            <div class="game-board-container">
                <div class="sudoku-grid" id="sudoku-grid">
                    <!-- Grid will be generated by JavaScript -->
                </div>
            </div>

            <!-- Control Panel -->
            <div class="control-panel">
                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="action-btn" id="note-btn" title="Note Mode">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 19l7 2-7-18-7 18 7-2zm0 0v-8"/>
                        </svg>
                        <span>NOTE</span>
                    </button>
                    <button class="action-btn" id="hint-btn" title="Hint">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 16v-4"/>
                            <path d="M12 8h.01"/>
                        </svg>
                        <span>HINT</span>
                    </button>
                    <button class="action-btn" id="delete-btn" title="Delete">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        <span>DELETE</span>
                    </button>
                </div>

                <!-- Numpad -->
                <div class="numpad" id="numpad">
                    <button class="num-btn" data-number="1">1</button>
                    <button class="num-btn" data-number="2">2</button>
                    <button class="num-btn" data-number="3">3</button>
                    <button class="num-btn" data-number="4">4</button>
                    <button class="num-btn" data-number="5">5</button>
                    <button class="num-btn" data-number="6">6</button>
                    <button class="num-btn" data-number="7">7</button>
                    <button class="num-btn" data-number="8">8</button>
                    <button class="num-btn" data-number="9">9</button>
                </div>

                <!-- Game Controls -->
                <div class="game-controls">
                    <div class="difficulty-selector">
                        <button class="difficulty-btn active" data-difficulty="easy">EASY</button>
                        <button class="difficulty-btn" data-difficulty="medium">MEDIUM</button>
                        <button class="difficulty-btn" data-difficulty="hard">HARD</button>
                    </div>
                    <button class="control-btn new-game-btn" id="new-game-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                        </svg>
                        NEW GAME
                    </button>
                    <button class="control-btn reset-btn" id="reset-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="1 4 1 10 7 10"/>
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                        </svg>
                        RESET
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>// SYSTEM STATUS: <span class="status-online">ONLINE</span> | NEURAL NETWORK v1.0</p>
        </footer>
    </div>

    <!-- Game Completion Modal -->
    <div class="modal" id="completion-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">DECRYPTION COMPLETE</h2>
                <p class="modal-subtitle">// SYSTEM UNLOCKED</p>
            </div>
            <div class="modal-body">
                <div class="completion-stats">
                    <div class="completion-stat">
                        <span class="completion-label">TIME</span>
                        <span class="completion-value" id="completion-time">00:00</span>
                    </div>
                    <div class="completion-stat">
                        <span class="completion-label">INTEGRITY</span>
                        <span class="completion-value" id="completion-integrity">100%</span>
                    </div>
                </div>
            </div>
            <button class="modal-btn" id="modal-new-game">START NEW DECRYPTION</button>
        </div>
    </div>

    <script src="assets/js/sudoku.js"></script>
</body>
</html>

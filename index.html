<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Decrypter - Sudoku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">
                <span class="glitch" data-text="NEURAL DECRYPTER">NEURAL DECRYPTER</span>
            </h1>
            <p class="subtitle">// SUDOKU PROTOCOL v2.0.4.7</p>
        </header>

        <div class="game-info">
            <div class="info-panel">
                <div class="system-integrity">
                    <label>SYSTEM INTEGRITY</label>
                    <div class="integrity-bar">
                        <div class="integrity-fill" id="integrityBar"></div>
                        <span class="integrity-text" id="integrityText">100%</span>
                    </div>
                </div>
                <div class="timer">
                    <label>UPTIME</label>
                    <div class="timer-display" id="timer">00:00</div>
                </div>
            </div>
            
            <div class="difficulty-selector">
                <label>PROTOCOL LEVEL</label>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn active" data-difficulty="easy">EASY</button>
                    <button class="difficulty-btn" data-difficulty="medium">MEDIUM</button>
                    <button class="difficulty-btn" data-difficulty="hard">HARD</button>
                </div>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- Sudoku grid will be generated here -->
        </div>

        <div class="controls">
            <div class="number-pad">
                <button class="number-btn" data-number="1">1</button>
                <button class="number-btn" data-number="2">2</button>
                <button class="number-btn" data-number="3">3</button>
                <button class="number-btn" data-number="4">4</button>
                <button class="number-btn" data-number="5">5</button>
                <button class="number-btn" data-number="6">6</button>
                <button class="number-btn" data-number="7">7</button>
                <button class="number-btn" data-number="8">8</button>
                <button class="number-btn" data-number="9">9</button>
            </div>
            
            <div class="action-buttons">
                <button class="action-btn" id="notesBtn">
                    <span class="btn-icon">📝</span>
                    <span class="btn-text">NOTES MODE</span>
                </button>
                <button class="action-btn" id="hintBtn">
                    <span class="btn-icon">💡</span>
                    <span class="btn-text">DECRYPT HINT</span>
                </button>
                <button class="action-btn" id="eraseBtn">
                    <span class="btn-icon">🗑️</span>
                    <span class="btn-text">ERASE</span>
                </button>
                <button class="action-btn primary" id="newGameBtn">
                    <span class="btn-icon">🔄</span>
                    <span class="btn-text">NEW PROTOCOL</span>
                </button>
            </div>
        </div>

        <div class="modal" id="winModal">
            <div class="modal-content">
                <h2 class="modal-title">DECRYPTION SUCCESSFUL</h2>
                <p class="modal-message">System integrity maintained.<br>Protocol completed.</p>
                <div class="modal-stats" id="modalStats"></div>
                <button class="modal-btn" id="modalNewGame">INITIATE NEW PROTOCOL</button>
            </div>
        </div>
    </div>

    <script src="assets/js/sudoku.js"></script>
</body>
</html>
